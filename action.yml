name: "RubyFast"
description: "A blazing-fast Ruby performance linter written in Rust"
author: "7a6163"

branding:
  icon: "zap"
  color: "red"

inputs:
  path:
    description: "Path to scan (file or directory)"
    required: false
    default: "."
  version:
    description: "RubyFast version to use (e.g. 1.0.0). Defaults to latest."
    required: false
    default: "latest"
  args:
    description: "Additional arguments to pass to rubyfast"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Run RubyFast
      shell: bash
      run: |
        docker pull "ghcr.io/7a6163/rubyfast:${{ inputs.version }}"
        docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          "ghcr.io/7a6163/rubyfast:${{ inputs.version }}" \
          ${{ inputs.args }} ${{ inputs.path }}
